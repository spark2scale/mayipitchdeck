<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="/MayILogoTransparentBack.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>May I Investor Deck</title>
    <meta
      name="description"
      content="May I investor pitch website: the AI revenue integrity engine for retail healthcare."
    />
    <!--
      Theme, applied before first paint to avoid a flash. Keep in sync with
      THEME_INIT_SCRIPT in src/colorScheme.ts. A `?theme=light|dark` query param (used by
      the PDF export route, see server/src/routes/pdfExport.ts) wins over the saved
      preference for that page load, and also updates the saved preference so the export
      page's own React app renders in the same theme it was asked for.
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var requested = params.get("theme");
          var theme = requested === "dark" || requested === "light"
            ? requested
            : localStorage.getItem("mayi-deck-theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
            if (requested) localStorage.setItem("mayi-deck-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
